[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-ai-memory"
version = "0.0.1"
description = "Embedding-backed memory and lore retrieval for LLM-driven NPCs in the Evennia ecosystem."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "mud", "llm", "npc", "memory", "lore", "embeddings", "pgvector"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    # Used by the lore commands.
    "evennia",
    # Resolves the library's alias and derives its router from db_spec.
    "evennia-database-cascade",
    # Owns the logging mechanism log.py binds to.
    "evennia-logging-extension",
    # Reads the lore repository — one interface over a local checkout and a
    # GitHub repo, so the import command works the same either way.
    "evennia-yaml-reader",
    "numpy>=1.24",
    "openai>=1.0",
    # pgvector.django imports django.contrib.postgres, which needs a psycopg
    # driver importable even when the consumer only ever runs SQLite.
    "pgvector>=0.2",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-ai-memory"
Repository = "https://github.com/FullCircleMUD/evennia-ai-memory"
Issues = "https://github.com/FullCircleMUD/evennia-ai-memory/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_ai_memory*"]
