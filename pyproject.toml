[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-ai-memory"
version = "0.0.1"
description = "Embedding-backed memory and lore retrieval for LLM-driven NPCs in the Evennia ecosystem."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "mud", "llm", "npc", "memory", "lore", "embeddings", "pgvector"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Deliberate divergence from the library standards: this library is a Django
# app with no Evennia runtime dependency. See CLAUDE.md principle 6.
dependencies = [
    "django>=4.2",
    "numpy>=1.24",
    "openai>=1.0",
    "pgvector>=0.2",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-ai-memory"
Repository = "https://github.com/FullCircleMUD/evennia-ai-memory"
Issues = "https://github.com/FullCircleMUD/evennia-ai-memory/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_ai_memory*"]
